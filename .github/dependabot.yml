version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    labels: [dependencies, rust]
    commit-message:
      prefix: "deps(rust)"
    ignore:
      # base64 0.23+ duplicates the dependency tree while reqwest, hyper-util, and
      # wiremock still pin 0.22, tripping the cargo-deny multiple-versions ban.
      # Patch updates stay enabled; revisit once the ecosystem moves to 0.23.
      - dependency-name: base64
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: pip
    directory: /crates/aikit-py
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/London
    open-pull-requests-limit: 5
    labels: [dependencies, python]
    commit-message:
      prefix: "deps(python)"

  - package-ecosystem: npm
    directory: /crates/aikit-node
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/London
    open-pull-requests-limit: 5
    labels: [dependencies, nodejs]
    commit-message:
      prefix: "deps(node)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: Europe/London
    open-pull-requests-limit: 5
    labels: [dependencies, ci]
    commit-message:
      prefix: "deps(actions)"
