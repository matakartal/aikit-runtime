name: Cache Cargo dependencies
description: Cache downloaded Cargo inputs without restoring executable build output

runs:
  using: composite
  steps:
    - name: Restore Cargo dependency cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: cargo-deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          cargo-deps-v1-${{ runner.os }}-${{ runner.arch }}-
